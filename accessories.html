<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rang CPH - Accessories</title>
    <meta name="robots" content="noindex">
    <meta name="description"
        content="Se Rangs håndlavede one of a kind-smykker og udvalgte accessories i et råt, urbant og unisex univers.">
    <link rel="icon" type="image/png" href="photos/favicon_io/favicon-32x32.png">
    <link rel="stylesheet" href="CSS/custom.css">
    <link rel="stylesheet" href="CSS/global.css">
    <link rel="stylesheet" href="CSS/smykker.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
</head>

<body>

    <header class="site-header">
        <nav class="main-nav">

            <a href="index.html" class="nav-logo">
                <img src="photos/rangLogo.svg" alt="Logo" class="logo-img">
            </a>

            <button class="burger-btn">=</button>

            <div class="nav-menu">
                <div class="nav-left">
                    <a href="smykker.html">Smykker</a>
                    <a href="accessories.html" class="active-link">Accessories</a>
                    <a href="Om.html">Om</a>
                    <a href="kontakt.html">Kontakt</a>
                </div>
                <div class="nav-right">
                    <a href="nyheder.html">Nyheder</a>
                    <a href="#" data-panel-open="login">Log ind</a>
                    <a href="#" data-panel-open="saved">Gemt (<span id="savedCount">0</span>)</a>
                    <a href="#" data-panel-open="cart">Kurv (<span id="cartCount">0</span>)</a>
                </div>
            </div>

        </nav>
    </header>

    <main>
        <h1 class="page-title">ACCESSORIES</h1>
        <div class="section-divider"></div>
        <div class="page-container">
            <div class="sort-container">

                <button id="sortToggle" class="sort-toggle">
                    SORTER +
                </button>

                <div id="sortContent" class="sort-content">

                    <label>
                        <input type="radio" name="sort" value="none" checked>
                        Ingen
                    </label>

                    <label>
                        <input type="radio" name="sort" value="price-asc">
                        Pris stigende
                    </label>

                    <label>
                        <input type="radio" name="sort" value="price-desc">
                        Pris faldende
                    </label>

                    <label>
                        <input type="radio" name="sort" value="az">
                        A-Å
                    </label>

                    <label>
                        <input type="radio" name="sort" value="za">
                        Å-A
                    </label>

                    <label>
                        <input type="radio" name="sort" value="size-asc">
                        Størrelse stigende
                    </label>

                    <label>
                        <input type="radio" name="sort" value="size-desc">
                        Størrelse faldende
                    </label>

                </div>
            </div>
            <div class="product-grid" id="produkt-liste">
            </div>
        </div>
    </main>
    <div class="section-divider"></div>
    <footer class="site-footer">

        <div class="footer-col">
            <a href="#">INSTAGRAM</a>
            <a href="#">FACEBOOK</a>
            <a href="#">TIKTOK</a>
        </div>

        <div class="footer-col">
            <a href="#">FAQ</a>
            <a href="#">KONTAKT</a>
            <a href="#">LEVERING</a>
            <p class="footer-address">Kompagniestræde 24, København K 1208</p>
        </div>

        <div class="footer-col logo-col">
            <img src="photos/rangLogo.svg" alt="RANG logo">
        </div>

    </footer>

    <aside id="cartPanel" class="slide-panel">
        <button class="panel-close">×</button>

        <h2>Kurv</h2>
        <div class="double-line"></div>

        <div id="cartItems" class="panel-items">
            <p>Din kurv er tom.</p>
        </div>

        <div class="panel-total">
            <span>Samlet beløb</span>
            <span id="cartTotal">0 DKK</span>
        </div>

        <button class="panel-main-btn">FORTSÆT</button>
    </aside>

    <aside id="savedPanel" class="slide-panel">
        <button class="panel-close">×</button>

        <h2>Gemte</h2>
        <div class="double-line"></div>

        <div id="savedItems" class="panel-items">
            <p>Du har ingen gemte produkter.</p>
        </div>
    </aside>

    <aside id="loginPanel" class="slide-panel">
        <button class="panel-close">×</button>

        <h2>Log ind</h2>
        <div class="double-line"></div>

        <form class="login-form" id="loginForm">
            <label for="loginEmail">E-mail</label>
            <input type="email" id="loginEmail">

            <label for="loginPassword">Adgangskode</label>
            <input type="password" id="loginPassword">

            <p id="loginError" class="login-error"></p>

            <button type="submit">LOG IND</button>

            <a href="#" class="create-profile-link">Lav profil</a>
        </form>
    </aside>

    <div id="panelOverlay" class="panel-overlay"></div>

    <script src="JS/navigation.js" defer></script>
    <script src="JS/slidepanels.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="JS/accessories.js" defer></script>

</body>

</html>
